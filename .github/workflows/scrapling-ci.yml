name: Scrapling Worker CI

on:
  push:
    branches: [crawler-mvp]
    paths:
      - 'scrapling-worker/**'
      - '.github/workflows/scrapling-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapling-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'scrapling[fetchers]==0.4.15' 'fastapi==0.116.1' 'uvicorn[standard]==0.35.0' 'psycopg[binary,pool]==3.2.10' 'httpx==0.28.1' 'pytest==8.4.1' 'pytest-asyncio==1.1.0'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app
